# Development HTTPS proxy; bind to loopback on the host. Use your own trusted certificate.
events {}
http {
  server {
    listen 8444 ssl;
    server_name lti-harness.127.0.0.1.nip.io;
    ssl_certificate /tls/tool.crt;
    ssl_certificate_key /tls/tool.key;
    location / {
      proxy_pass http://lti-harness-moodle:8080;
      # Real Moodle signed OIDC hints can exceed nginx's default header buffer.
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
