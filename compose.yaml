services:
  tool:
    build: .
    image: lti-test-harness:local
    ports:
      - "127.0.0.1:${HARNESS_PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      HARNESS_TOKEN: ${HARNESS_TOKEN:?Set HARNESS_TOKEN in .env (at least 16 characters)}
      ALLOW_NUMERIC_RESOURCE_LINK_ID: ${ALLOW_NUMERIC_RESOURCE_LINK_ID:-false}
    volumes:
      - tool-data:/data
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  tool-data:
